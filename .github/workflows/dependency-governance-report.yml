name: Dependency Governance Report

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 9 AM UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/dependency_governance_report.py"
      - "tests/dependency_governance/**"
      - ".github/workflows/dependency-governance-report.yml"

permissions:
  contents: read
  security-events: read
  vulnerability-alerts: read
  pull-requests: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests/dependency_governance -v

  collect:
    name: Collect and Report
    runs-on: ubuntu-latest
    needs: test
    # Only run collection on schedule or manual trigger, not on PR
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: read
      vulnerability-alerts: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect dependency governance data
        run: |
          python3 scripts/dependency_governance_report.py collect \
            --repository "${{ github.repository }}" \
            --output /tmp/governance-report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post report to step summary
        if: success()
        run: cat /tmp/governance-report/report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload report artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-governance-report
          path: /tmp/governance-report/
          retention-days: 90
          if-no-files-found: warn

      - name: Report collection failure
        if: failure()
        run: |
          echo "## Dependency Governance Report: Collection Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The dependency governance report collection failed. See workflow logs for details." >> $GITHUB_STEP_SUMMARY
          exit 1
