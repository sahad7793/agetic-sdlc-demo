name: Azure Alert to Incident Issue

on:
  push:
    paths:
      - ".github/workflows/azure-alert-to-issue.yml"
      - "scripts/azure_alert_to_issue.py"
      - "tests/azure_alert_to_issue/**"
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Run the local synthetic fixture or poll configured Azure scopes
        type: choice
        options: [fixture, poll]
        default: fixture
        required: true
      publish:
        description: Create issues from live alerts (poll mode only; also requires AZURE_ALERTS_PUBLISH_ENABLED)
        type: boolean
        default: false
        required: true
      alert_fingerprint:
        description: Target specific alert by 64-hex fingerprint (manual publish only; required for publish=true)
        type: string
        default: ""
        required: false

permissions: {}

concurrency:
  group: azure-alert-to-issue
  cancel-in-progress: false

jobs:
  validate-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out trusted source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run offline alert poller tests and fixture
        run: |
          python3 -m unittest discover -s tests/azure_alert_to_issue -v
          python3 scripts/azure_alert_to_issue.py poll --fixture tests/azure_alert_to_issue/fixtures/fired_alert.json

  fixture:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'fixture'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out trusted source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Inspect the synthetic alert fixture (offline, no writes)
        run: python3 scripts/azure_alert_to_issue.py poll --fixture tests/azure_alert_to_issue/fixtures/fired_alert.json

  configuration:
    # Manual live polls need AZURE_ALERTS_ENABLED; manual publish additionally
    # requires AZURE_ALERTS_PUBLISH_ENABLED. Scheduled publication is separately
    # disabled unless AZURE_ALERTS_SCHEDULE_ENABLED is explicitly true.
    if: >-
      vars.AZURE_ALERTS_ENABLED == 'true' &&
      ((github.event_name == 'schedule' && vars.AZURE_ALERTS_SCHEDULE_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'poll'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: azure-alerts
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.config.outputs.ready }}
      publish: ${{ steps.config.outputs.publish }}
      fingerprint: ${{ steps.config.outputs.fingerprint }}
    env:
      AZURE_ALERTS_ENABLED: ${{ vars.AZURE_ALERTS_ENABLED }}
      AZURE_ALERTS_PUBLISH_ENABLED: ${{ vars.AZURE_ALERTS_PUBLISH_ENABLED }}
      AZURE_ALERTS_SCHEDULE_ENABLED: ${{ vars.AZURE_ALERTS_SCHEDULE_ENABLED }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ALERT_SCOPES: ${{ vars.AZURE_ALERT_SCOPES }}
      ALERT_TRIGGER: ${{ github.event_name }}
      ALERT_PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
      ALERT_FINGERPRINT_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.alert_fingerprint || '' }}
    steps:
      - name: Check out trusted source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check explicit opt-in and non-secret configuration
        id: config
        run: python3 scripts/azure_alert_to_issue.py configuration --output "$GITHUB_OUTPUT"

  poll-dry-run:
    needs: configuration
    if: >-
      needs.configuration.result == 'success' &&
      needs.configuration.outputs.ready == 'true' &&
      needs.configuration.outputs.publish == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: azure-alerts
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ALERTS_ENABLED: ${{ vars.AZURE_ALERTS_ENABLED }}
      AZURE_ALERT_SCOPES: ${{ vars.AZURE_ALERT_SCOPES }}
    steps:
      - name: Check out trusted source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Poll fired alerts (dry run, no GitHub writes)
        run: python3 scripts/azure_alert_to_issue.py poll

  poll-publish:
    needs: configuration
    if: >-
      needs.configuration.result == 'success' &&
      needs.configuration.outputs.ready == 'true' &&
      needs.configuration.outputs.publish == 'true' &&
      ((github.event_name == 'schedule' && vars.AZURE_ALERTS_SCHEDULE_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && vars.AZURE_ALERTS_PUBLISH_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: azure-alerts
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ALERTS_ENABLED: ${{ vars.AZURE_ALERTS_ENABLED }}
      AZURE_ALERTS_PUBLISH_ENABLED: ${{ vars.AZURE_ALERTS_PUBLISH_ENABLED }}
      AZURE_ALERTS_SCHEDULE_ENABLED: ${{ vars.AZURE_ALERTS_SCHEDULE_ENABLED }}
      AZURE_ALERT_SCOPES: ${{ vars.AZURE_ALERT_SCOPES }}
      ALERT_TRIGGER: ${{ github.event_name }}
      ALERT_FINGERPRINT_TARGET: ${{ needs.configuration.outputs.fingerprint }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out trusted source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Poll fired alerts and create deduplicated issues
        run: python3 scripts/azure_alert_to_issue.py poll --publish
