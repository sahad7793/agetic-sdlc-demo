name: Mutation testing

on:
  pull_request:
    branches: [main]
    paths:
      - ".config/dotnet-tools.json"
      - ".github/workflows/mutation-testing.yml"
      - "global.json"
      - "src/TaskManagement.Api/Services/TaskService.cs"
      - "src/TaskManagement.Api/TaskManagement.Api.csproj"
      - "tests/TaskManagement.Api.Tests/TaskManagement.Api.Tests.csproj"
      - "tests/TaskManagement.Api.Tests/TaskServiceTests.cs"
      - "tests/TaskManagement.Api.Tests/stryker-config.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mutation-testing:
    name: TaskService mutations (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools and test project
        run: |
          dotnet tool restore
          dotnet restore tests/TaskManagement.Api.Tests/TaskManagement.Api.Tests.csproj

      - name: Run Stryker
        working-directory: tests/TaskManagement.Api.Tests
        run: dotnet stryker 2>&1 | tee "$RUNNER_TEMP/stryker.log"

      - name: Add mutation summary
        if: always()
        env:
          STRYKER_LOG: ${{ runner.temp }}/stryker.log
        run: |
          {
            echo "## Mutation testing (advisory)"
            echo
            echo "Scope: \`TaskService.cs\`, exercised by \`TaskServiceTests\`."
            if [ -f "$STRYKER_LOG" ]; then
              score=$(sed -nE 's/.*The final mutation score is ([0-9]+([.][0-9]+)?) %.*/\1%/p' "$STRYKER_LOG" | tail -n 1)
              if [ -n "$score" ]; then
                echo "Mutation score: **$score**"
              else
                echo "Mutation score unavailable; inspect the log and HTML report."
              fi
            else
              echo "Mutation score unavailable; Stryker did not produce a log."
            fi
            echo
            echo "A low score is informational and does not fail this job or change required checks."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: |
            tests/TaskManagement.Api.Tests/StrykerOutput/
            ${{ runner.temp }}/stryker.log
          if-no-files-found: warn
          retention-days: 14
