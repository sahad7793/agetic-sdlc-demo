name: Lifecycle label router

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: lifecycle-router-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  route:
    name: Validate lifecycle transition
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Route lifecycle label
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/lifecycle_router.py route
