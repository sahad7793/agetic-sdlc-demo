name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  build-test-codeql:
    name: Build, test, and analyze
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Initialize CodeQL before building so its C# extractor observes compilation.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore
        run: dotnet restore TaskManagementDemo.sln

      - name: Build
        run: dotnet build TaskManagementDemo.sln --configuration Release --no-restore

      - name: Test with coverage
        run: dotnet test TaskManagementDemo.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn

      - name: Analyze CodeQL database
        uses: github/codeql-action/analyze@v4
