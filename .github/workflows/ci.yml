name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  build-test-codeql:
    name: Build, test, and analyze
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Test SDLC metric contracts
        run: python3 -m unittest discover -s tests/sdlc_metrics

      - name: Test custom agent definitions
        run: python3 -m unittest discover -s tests/agent_definitions

      - name: Test CI workflow permissions
        run: python3 -m unittest discover -s tests/ci_workflow

      - name: Test coverage report
        run: python3 -m unittest discover -s tests/coverage_report

      - name: Test agentic workflow contracts
        run: python3 -m unittest discover -s tests/agentic_workflows

      - name: Test rollback contracts
        run: python3 -m unittest discover -s tests/rollback

      - name: Test incident-response contracts
        run: python3 -m unittest discover -s tests/incident_response

      - name: Test release-notes contracts
        run: python3 -m unittest discover -s tests/release_notes

      - name: Test performance-gate contracts
        run: python3 -m unittest discover -s tests/perf_gate

      - name: Test EF migration-safety contracts
        run: python3 -m unittest discover -s tests/migration_safety

      - name: Test issue-link check
        run: python3 -m unittest discover -s tests/issue_link

      - name: Test lifecycle label router
        run: python3 -m unittest discover -s tests/lifecycle_router

      - name: Test cost-governance report contracts
        run: python3 -m unittest discover -s tests/cost_governance

      - name: Test dependency-governance report contracts
        run: python3 -m unittest discover -s tests/dependency_governance

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Initialize CodeQL before building so its C# extractor observes compilation.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore
        run: dotnet restore TaskManagementDemo.sln

      - name: Build
        run: dotnet build TaskManagementDemo.sln --configuration Release --no-restore

      - name: Test with coverage
        run: dotnet test TaskManagementDemo.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Report test coverage
        run: python3 scripts/coverage_report.py --results-directory TestResults --report TestResults/coverage-summary.md

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn

      - name: Analyze CodeQL database
        uses: github/codeql-action/analyze@v4
        with:
          upload: false
