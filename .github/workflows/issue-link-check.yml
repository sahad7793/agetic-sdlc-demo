name: Issue link check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  issue-link:
    name: Validate issue reference
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Check pull request body
        if: hashFiles('scripts/issue_link_check.py') != ''
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/issue_link_check.py

      - name: Report bootstrap-only skip
        if: hashFiles('scripts/issue_link_check.py') == ''
        run: echo "::notice::Trusted base revision does not contain the issue-link checker yet; no PR content was executed."
