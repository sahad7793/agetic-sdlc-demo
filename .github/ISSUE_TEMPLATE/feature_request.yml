name: Feature request
description: Propose a user-facing or internal capability for the Task Management API.
title: "[Feature]: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: Provide enough detail for a human or implementation agent to plan the change safely.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What problem does this solve, and for whom?
    validations:
      required: true
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      options:
        - API contract / controller
        - Service / business rules
        - Repository / persistence
        - Tests
        - CI or agentic workflow
        - Documentation
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List observable outcomes, edge cases, and any API contract changes.
      placeholder: |
        - Given ..., when ..., then ...
        - ...
    validations:
      required: true
  - type: textarea
    id: implementation-notes
    attributes:
      label: Implementation notes
      description: Optional constraints, examples, or links.
